name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: |
          set -o pipefail
          for i in 1 2 3 4; do
            if mvn -B package 2>&1 | tee build.log; then exit 0; fi
            echo "Deneme $i basarisiz, 45 sn bekleniyor"
            sleep 45
          done
          exit 1
      - name: Show errors
        if: failure()
        run: |
          grep -E "\[ERROR\].*(\.java|symbol|cannot|error:)" build.log | head -12 | while read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: S-Emotes
          path: target/S-Emotes-*.jar
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: target/S-Emotes-*.jar
